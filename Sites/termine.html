<body>
  <header>
    <div class="header-left">
      <a href="/index.html">
        <picture>
          <source srcset="/Icons/headerlogo_dark.png" media="(prefers-color-scheme: dark)">
          <img src="/Icons/headerlogo.png" alt="Schachunion Schorndorf" class="headerlogo">
        </picture>
      </a>
    </div>
    <div class="header-right">
      <nav class="navigation">
        <button class="menu-button"></button>
        <ul class="navigation-content">
          <li class="header-titles"><a href="/Sites/news.html">News</a></li>
          <li class="header-titles"><a href="/Sites/mannschaften.html">Mannschaften</a></li>

        </ul>
      </nav>
    </div>

  <main>
    <div class="termine-container">
      <div class="calendar-wrapper">
        <div class="calendar-nav">
          <button id="prevMonth">&lt;</button>
          <div>
            <button id="monthYear"></button>
          </div>
          <button id="nextMonth">&gt;</button>
        </div>
        <div id="calendar-loader" class="loader-svg">
          <svg class="container" viewBox="0 0 35 35" height="35" width="35">
            <rect class="track" x="2.5" y="2.5" fill="none" stroke-width="5px" width="32.5" height="32.5"/>
            <rect class="car" x="2.5" y="2.5" fill="none" stroke-width="5px" width="32.5" height="32.5" pathlength="100"/>
          </svg>
        </div>
        <div id="calendar"></div>
      </div>
      <div class="termine-list-wrapper">
        <h2>Nächste Termine:</h2>
        <div class="pagination">
          <button id="prevPage">Vorherige</button>
          <button id="nextPage">Nächste</button>
        </div>
        <div id="calendar-list-loader" class="loader-svg">
          <svg class="container" viewBox="0 0 35 35" height="35" width="35">
            <rect class="track" x="2.5" y="2.5" fill="none" stroke-width="5px" width="32.5" height="32.5"/>
            <rect class="car" x="2.5" y="2.5" fill="none" stroke-width="5px" width="32.5" height="32.5" pathlength="100"/>
          </svg>
        </div>
        <ul id="termineList" class="termine-list"></ul>
      </div>
    </div>
  </main>
