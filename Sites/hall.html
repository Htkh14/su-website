    <div class="header-right">

  <main>
    <h1>Hall of Fame</h1>

    <div class="carousel-container">
      <div class="carousel">
        <div class="card">
          <img src="/Icons/stadtmeisterschaft.png" alt="Stadtmeisterschaft">
          <ul id="stadtmeisterschaft"></ul>
        </div>
        <div class="card">
          <img src="/Icons/vereinspokal.png" alt="Vereinspokal">
          <ul id="vereinspokal"></ul>
        </div>
        <div class="card">
          <img src="/Icons/schach960.png" alt="Schach-960-Turniere">
          <ul id="schach960"></ul>
        </div>
        <div class="card">
          <img src="/Icons/tandem.png" alt="Tandemturniere">
          <ul id="tandem"></ul>
        </div>
        <div class="card">
          <img src="/Icons/blitz.png" alt="Blitzschachturniere">
          <ul id="blitz"></ul>
        </div>
        <div class="card">
          <img src="/Icons/schnellschach.png" alt="Schnellschachturniere">
          <ul id="schnellschach"></ul>
        </div>
      </div>
    </div>

    <div class="controls">
      <button onclick="rotateCarousel(1)">◀</button>
      <button onclick="rotateCarousel(-1)">▶</button>
    </div>
